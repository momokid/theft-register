---
# cPanel Git Version Control deploy script. Runs entirely on the cPanel server
# when a deploy is triggered there — it has no access to GitHub or its secrets.
#
# Application root: liability-overview.rhsecurityltd.com (must match both the
# Node.js App's "Application root" and the Git repository's "Repository Path"
# in cPanel — they need to point at the same directory, so these tasks run
# directly against the live app, no separate copy step).
# Node version: 18.20.8 (cPanel's recommended version on this platform).
#
# $HOME is set by cPanel's own shell to the account's home directory, so the
# username itself never needs to be written here.
#
# cPanel runs these commands in order via /bin/bash -c, stopping on the first failure.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/liability-overview.rhsecurityltd.com/
    - source $HOME/nodevenv/liability-overview.rhsecurityltd.com/18.20.8/bin/activate
    - cd $DEPLOYPATH && npm install
    - cd $DEPLOYPATH && npm run build
    - cd $DEPLOYPATH && npm run migrate
    - deactivate
    - mkdir -p $DEPLOYPATH/tmp
    - touch $DEPLOYPATH/tmp/restart.txt
