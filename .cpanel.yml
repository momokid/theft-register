---
# cPanel Git Version Control deploy script. Runs on the cPanel server when
# "Deploy HEAD Commit" is clicked; it has no access to GitHub or its secrets.
#
# Two folders on purpose, so the git checkout never gets dirty (cPanel greys
# out Deploy when it does):
#   repo (git clone):  ~/repositories/theft-register
#   app  (Node.js App "Application root"): ~/liability-overview.rhsecurityltd.com
#
# Node version 18.20.8 (cPanel's recommended version on this platform).
# $HOME is set by cPanel's shell, so the username is never written here.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/liability-overview.rhsecurityltd.com/
    - mkdir -p $DEPLOYPATH
    - /bin/rsync -a --delete --exclude=.git --exclude=node_modules --exclude=client/dist --exclude=tmp --exclude=.htaccess --exclude=stderr.log --exclude=.env $HOME/repositories/theft-register/ $DEPLOYPATH
    - source $HOME/nodevenv/liability-overview.rhsecurityltd.com/18.20.8/bin/activate
    - cd $DEPLOYPATH && npm install --include=dev
    - cd $DEPLOYPATH && npm run build
    - cd $DEPLOYPATH && npm run migrate
    - deactivate
    - mkdir -p $DEPLOYPATH/tmp
    - touch $DEPLOYPATH/tmp/restart.txt
