---
# cPanel Git Version Control deploy script. Runs entirely on the cPanel server
# when a deploy is triggered there — it has no access to GitHub or its secrets,
# and none of the values below are secret (they're just directory names), so
# they're filled in directly rather than pulled from anywhere.
#
# Before the first deploy, fill in the two placeholders below:
#   <APP_ROOT>     — the app's path relative to your home dir, e.g. theft-register.
#                    Must match both the Node.js App's "Application root" AND the
#                    Git repository's "Repository Path" in cPanel — they need to
#                    point at the same directory, so these tasks run directly
#                    against the live app, no separate copy step.
#   <NODE_VERSION> — the Node version you picked in "Setup Node.js App" (e.g. 20.11.1)
#
# $HOME is set by cPanel's own shell to the account's home directory, so the
# username itself never needs to be written here.
#
# cPanel runs these commands in order via /bin/bash -c, stopping on the first failure.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/<APP_ROOT>/
    - source $HOME/nodevenv/<APP_ROOT>/<NODE_VERSION>/bin/activate
    - cd $DEPLOYPATH && npm install
    - cd $DEPLOYPATH && npm run build
    - cd $DEPLOYPATH && npm run migrate
    - deactivate
    - mkdir -p $DEPLOYPATH/tmp
    - touch $DEPLOYPATH/tmp/restart.txt
