name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: theft_register_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Written fresh each run — CI has no access to the real .env.test (gitignored,
      # and its DB password is local-only anyway). Also copied to .env so migrate.js
      # and create-user.js (which load .env by default) pick up the same connection.
      - name: Write CI env
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=3001
          APP_ORIGIN=http://localhost:5173
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=root
          DB_NAME=theft_register_test
          JWT_SECRET=ci-only-secret-not-used-anywhere-else-000000
          COOKIE_SECURE=false
          EOF
          cp .env.test .env

      - name: Load schema and run migrations
        run: |
          mysql -h127.0.0.1 -uroot -proot theft_register_test < schema.sql
          npm run migrate

      - name: Create the test-admin fixture
        run: printf 'TestPass123\n' | node scripts/create-user.js --name "Test Admin" --email test-admin@example.com --admin

      # Only the test files that seed their own rows. thefts/prices/quantity/export
      # assert against the real historical dataset (data.sql), which is gitignored
      # as real business data and isn't available to CI — those are verified locally
      # against the real seeded DB instead (see README).
      - name: Run self-contained tests
        run: node --test --test-concurrency=1 test/auth.test.js test/accounts.test.js test/audit.test.js test/import.test.js

      - name: Build client
        run: npm run build

      - name: npm audit (informational)
        run: npm audit --audit-level=high || true

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APP_DIR: liability-overview.rhsecurityltd.com
      NODE_VERSION_DIR: '18'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Staging folder holds exactly what the server needs; .env is built from secrets here
      # and never committed.
      - name: Stage release
        env:
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          mkdir -p release/client
          cp -r app.js package.json package-lock.json schema.sql migrations scripts server release/
          cp -r client/dist release/client/dist
          {
            echo "NODE_ENV=production"
            echo "APP_ORIGIN=$APP_ORIGIN"
            echo "DB_HOST=$DB_HOST"
            echo "DB_PORT=$DB_PORT"
            echo "DB_NAME=$DB_NAME"
            echo "DB_USER=$DB_USER"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "COOKIE_SECURE=true"
          } > release/.env
          chmod 600 release/.env

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "DEPLOY_SSH_KEY is not a valid private key — paste the whole theft_deploy file (BEGIN to END), not the .pub"; exit 1; }
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # node_modules, tmp and .htaccess are managed on the server (CloudLinux keeps
      # node_modules as a symlink), so rsync must never touch them.
      - name: Upload
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete \
            --exclude=node_modules --exclude=tmp --exclude=.htaccess --exclude=stderr.log \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT" \
            release/ "$DEPLOY_USER@$DEPLOY_HOST:$APP_DIR/"

      - name: Install, migrate, restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR=$APP_DIR NODE_VERSION_DIR=$NODE_VERSION_DIR bash -s" <<'REMOTE'
          set -eo pipefail
          VENV="$HOME/nodevenv/$APP_DIR/$NODE_VERSION_DIR"
          cd "$HOME/$APP_DIR"
          [ -e node_modules ] || ln -s "$VENV/lib/node_modules" node_modules
          source "$VENV/bin/activate"
          npm install --omit=dev
          npm run migrate
          if [ ! -f .htaccess ]; then
            cat > .htaccess <<HT
          # DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION BEGIN
          PassengerAppRoot "$HOME/$APP_DIR"
          PassengerBaseURI "/"
          PassengerNodejs "$VENV/bin/node"
          PassengerAppType node
          PassengerStartupFile app.js
          # DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION END
          <Files ".env">
            Require all denied
          </Files>
          HT
          fi
          mkdir -p tmp
          touch tmp/restart.txt
          REMOTE
